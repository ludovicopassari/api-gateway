services:
  redis:
    image: redis:7-alpine
    container_name: api-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gateway-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      API_GATEWAY_PORT: ${API_GATEWAY_PORT}
      GIN_MODE: ${GIN_MODE}
    ports:
      - "${API_GATEWAY_PORT}:80"
    networks:
      - gateway-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - api-gateway
      - redis
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    
    networks:
      - gateway-network

volumes:
  redis_data:
    driver: local

networks:
  gateway-network:
    driver: bridge